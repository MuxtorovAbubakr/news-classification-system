services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: news-api
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: news-frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000/predict
    depends_on:
      - api